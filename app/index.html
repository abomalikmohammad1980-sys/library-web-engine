<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b654f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="الخِزانة" />
    <title>الخزانة: المكتبة الإسلامية الذكية</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('alkhizana:settings:v1') || '{}')
        const theme = ['light', 'dark', 'sepia'].includes(saved.theme) ? saved.theme : 'original'
        document.documentElement.dataset.appTheme = theme
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = ({ original: '#f1ede3', light: '#ffffff', dark: '#171816', sepia: '#eadcc3' })[theme]
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
