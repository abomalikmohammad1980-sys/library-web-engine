name: Prepare verified reader pages
on:
  workflow_dispatch:
    inputs:
      book_id:
        required: true
        type: string
      binding:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: reader-preparation-${{ inputs.book_id }}-${{ inputs.binding }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.BOOK_INDEX_PRODUCTION_ACTIONS_ENABLED == 'true' && vars.PUBLIC_BOOK_PRODUCTION_INGESTION_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare and activate fenced reader package
        env:
          PUBLIC_BOOK_INGESTION_ENABLED: 'true'
          PUBLIC_BOOK_INGESTION_ACCEPTED: 'true'
          PUBLIC_BOOK_INDEX_GATEWAY_ORIGIN: https://khzanah.com
          PUBLIC_BOOK_INDEX_RUNNER_TOKEN: ${{ secrets.PUBLIC_BOOK_INDEX_PRODUCTION_RUNNER_TOKEN }}
          READER_TARGET_BOOK_ID: ${{ inputs.book_id }}
          READER_TARGET_BINDING: ${{ inputs.binding }}
        run: node tools/reader-page-preparation-runner.mjs
