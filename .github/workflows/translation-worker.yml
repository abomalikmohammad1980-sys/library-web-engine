name: Translation worker

on:
  push:
    paths:
      - 'deployment/translate-worker/**'
      - '.github/workflows/translation-worker.yml'
  pull_request:
    paths:
      - 'deployment/translate-worker/**'
      - '.github/workflows/translation-worker.yml'

permissions:
  contents: read

jobs:
  translation-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate worker syntax
        run: node --check deployment/translate-worker/src/index.js
      - name: Check translation contract and guards
        run: node --experimental-vm-modules --test deployment/translate-worker/test/worker.test.mjs
      - name: Build without publishing
        run: npx --yes wrangler@4.143.1 deploy --dry-run --config deployment/translate-worker/wrangler.toml --outdir /tmp/translation-worker-build
        env:
          WRANGLER_SEND_METRICS: 'false'
