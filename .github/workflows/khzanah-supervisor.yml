name: Khzanah free translation supervisor

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check only; do not start or stop Kaggle'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: khzanah-translation-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    if: vars.SUPERVISOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Kaggle CLI
        run: python -m pip install 'kaggle==2.2.5' 'six>=1.16,<2'
      - name: Verify Kaggle SDK import
        run: python -c 'from kaggle import api; from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest'
      - name: Verify supervisor decisions
        run: python -m unittest discover -s deployment/translation-supervisor -p 'test_*.py'
      - name: Check and act once
        id: supervisor
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SUPERVISOR_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python deployment/translation-supervisor/supervisor.py > supervisor.log 2>&1
      - name: Show bounded result
        if: always()
        run: tail -n 8 supervisor.log
      - name: Derive alert identity
        if: steps.supervisor.outcome == 'failure'
        id: alert
        shell: bash
        run: |
          python - <<'PY'
          import datetime, os, re
          text = open('supervisor.log', encoding='utf-8', errors='replace').read()
          match = re.search(r'"version":\s*(\d+)', text)
          key = 'v' + match.group(1) if match else 'setup-' + datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('key=' + key + '\n')
          PY
      - uses: actions/cache/restore@v4
        if: steps.supervisor.outcome == 'failure'
        id: alert_cache
        with:
          path: .supervisor-alerts/${{ steps.alert.outputs.key }}
          key: khzanah-alert-${{ steps.alert.outputs.key }}
      - name: Alert Telegram once per version
        if: steps.supervisor.outcome == 'failure' && steps.alert_cache.outputs.cache-hit != 'true'
        id: notification
        env:
          TELEGRAM_STATUS_BOT_TOKEN: ${{ secrets.TELEGRAM_STATUS_BOT_TOKEN }}
          TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
        run: python deployment/translation-supervisor/notify.py .supervisor-alerts/${{ steps.alert.outputs.key }}
      - uses: actions/cache/save@v4
        if: steps.supervisor.outcome == 'failure' && steps.alert_cache.outputs.cache-hit != 'true' && steps.notification.outcome == 'success'
        with:
          path: .supervisor-alerts/${{ steps.alert.outputs.key }}
          key: khzanah-alert-${{ steps.alert.outputs.key }}
      - name: Preserve failure status
        if: steps.supervisor.outcome == 'failure'
        run: exit 1
