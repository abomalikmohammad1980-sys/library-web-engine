name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الاعتمادات
        run: pnpm install --frozen-lockfile

      - name: التحقق من مستعيد بيانات البناء
        run: node --test tools/ci/restore-public-assets.test.mjs

      - name: استعادة بيانات البناء العامة المثبتة بالبصمة
        run: node tools/ci/restore-public-assets.mjs

      - name: فحص الأنواع
        run: pnpm typecheck

      - name: بناء الحزم
        run: pnpm build

      - name: الاختبارات
        run: pnpm test --maxWorkers=2 --reporter=default --reporter=json --outputFile=ci-test-results.json

      - name: حفظ نتائج الاختبارات بما فيها الحالات المتجاوزة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: ci-test-results.json
          if-no-files-found: ignore

      # بوابة عدم انحدار المُحكِّم — تُفعَّل فعليًا بعد بناء oracle-client
      # في المرحلة 0 (تقارن ضد corpus/ground-truth المخزنة في LFS، بلا Word).
      - name: المُحكِّم (عينة)
        run: pnpm oracle:check
